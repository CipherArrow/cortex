name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is a claim in README/pyproject, so prove it on every push
        # rather than only on whatever the author happens to run locally.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke suite
        run: python tests/test_smoke.py

      - name: Security suite
        run: python tests/test_security.py

      - name: Language suite
        run: python tests/test_languages.py

  package:
    name: package installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Zero dependencies is a constraint, not a hope
        run: |
          deps="$(python -m pip show cortex-graph | awk -F': ' '/^Requires:/{print $2}')"
          if [ -n "$deps" ]; then
            echo "::error::cortex-graph gained dependencies: $deps"
            exit 1
          fi
          echo "Requires: (empty) — stdlib only, as designed"

      - name: Installed command works outside the source tree
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          printf 'def ci_probe():\n    return 1\n' > a.py
          cortex scan
          cortex query ci_probe | grep -q ci_probe
          cortex status
